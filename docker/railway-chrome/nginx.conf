# Reverse proxy in front of Chrome's DevTools port. Chrome refuses HTTP
# requests whose Host header isn't localhost/an IP (DNS-rebinding
# protection), so this rewrites the Host header on the way in. Chrome then
# echoes that same host:port back in the JSON response's
# "webSocketDebuggerUrl" field, which sub_filter rewrites to the address
# other Railway services actually use to reach this one
# (<service-name>.railway.internal) so the follow-up WebSocket connection
# doesn't try to dial back into this container's own loopback.
worker_processes 1;
events { worker_connections 64; }
http {
  server {
    listen 9222;
    location / {
      proxy_pass http://127.0.0.1:9223;
      proxy_set_header Host 127.0.0.1:9223;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      sub_filter '127.0.0.1:9223' 'chrome.railway.internal:9222';
      sub_filter_once off;
      sub_filter_types application/json;
    }
  }
}
